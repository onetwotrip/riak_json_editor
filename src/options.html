<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Riak JSON Editor Options</title>
  <script src="options.js"></script>
</head>
<body>
  <h3>Options</h3>
  <label>
    <input type="checkbox" id="enabled" name="enabled" />

  <input type="text" id="riak_path" name="riak_path" />

  <button id="saveBtn" type="button" name="saveBtn">Save</button>
  <span id="status"></span>
</body>
</html>
