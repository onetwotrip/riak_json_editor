<!DOCTYPE html>
<html>
<head>
   <meta charset="utf-8"/>
   <title>Riak JSON Editor</title>
   <link rel="stylesheet" href="jsoneditor.min.css"/>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    body { display: flex; flex-direction: column; }
    #main { display: flex; flex: 1; }
    #messages { display: none; padding: 10px; font-family: sans-serif; }
    #editor { flex: 1; }
    #meta { display: flex; flex-direction: column; width: 280px; padding: 10px; font-family: sans-serif; background: #f0f0f0; border-left: 1px solid #ddd; }
    #meta #buttons { display: flex; justify-content: space-between; margin-bottom: 16px; }
    #meta button { margin: 0; }
    #deleteBtn { color: darkred; }
    /* Metadata field styling */
    #meta .meta-field { margin-bottom: 8px; }
    #meta .meta-field strong { font-weight: bold; }
    #meta .meta-value { margin-left: 12px; }
    #meta .link-field { margin-bottom: 12px; }
    #meta .link-meta { margin-left: 12px; }
  </style>
   <script src="jquery-1.8.2.min.js"></script>
   <script src="jsoneditor.min.js"></script>
   <script src="editor.js"></script>
</head>
<body>
  <div id="main">
    <div id="editor"></div>
    <div id="meta"></div>
  </div>
  <div id="messages"></div>
</body>
</html>
