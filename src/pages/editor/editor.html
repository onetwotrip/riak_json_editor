<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>Riak JSON Editor</title>
    <link href="/pages/editor/editor.css" rel="stylesheet"/>
    <link href="/vendor/jsoneditor.min.css" rel="stylesheet"/>
    <script src="/vendor/jsoneditor.min.js"></script>
    <script id="template-meta" type="text/mustache">
        <div id="buttons">
          <button id="saveBtn" type="button">Save</button>
          <button id="deleteBtn" type="button">Delete</button>
        </div>
        <div id="meta-content">
          {{#fields}}
          <div class="meta-field">
            <strong>{{name}}</strong>
            <div class="meta-value">{{value}}</div>
          </div>
          {{/fields}}
          <div class="meta-field">
            <strong>Links</strong>
          </div>
          {{#links}}
          <div class="link-field">
            <div class="link-meta">
            {{#id}}
              <strong>{{meta}}</strong> ({{bucket}})<br/>
              <a href="{{origin}}{{url}}" target="_blank">{{id}}</a>
            {{/id}}
            {{^id}}
              <pre>{{meta}}<br/>{{url}}</pre>
            {{/id}}
            </div>
          </div>
          {{/links}}
          {{^links}}
          <div class="link-field">
            <div class="link-meta">
              <em>No links</em>
            </div>
          </div>
          {{/links}}
        </div>
    </script>
    <script id="template-message" type="text/mustache">
        <div id="messages" style="display: flex;{{#isError}} color: red;{{/isError}}">
            <span class="msg-text">{{message}}</span>
            <button class="msg-close" type="button">&times;</button>
        </div>
    </script>
    <script src="/vendor/mustache-3.2.1.min.js"></script>
    <script src="/pages/editor/editor.js"></script>
</head>
<body>
<div id="main">
    <div id="editor"></div>
    <div id="meta"></div>
</div>
<div id="messages"></div>
</body>
</html>
